#!/bin/bash
# scripts/update-secrets.sh
# Updates GitHub Actions secrets from Terraform output.
# Run this after every terraform apply.
#
# Requirements:
#   - gh CLI installed and authenticated (gh auth login)
#   - terraform output available (run from repo root)

set -euo pipefail

echo "==> Reading Terraform outputs..."
SALT_MASTER_IP=$(terraform output -raw salt_master_floating_ip)
REPOSITORY=$(terraform output -raw repository)
REPO=$(echo "${REPOSITORY}" | sed 's|https://github.com/||' | sed 's|\.git$||')

echo "==> Updating GitHub Actions secrets for ${REPO}..."
gh secret set SALT_MASTER_IP --repo "${REPO}" --body "${SALT_MASTER_IP}"
gh secret set REPOSITORY --repo "${REPO}" --body "${REPOSITORY}"

echo ""
echo "Done. The following secrets have been updated:"
echo "  SALT_MASTER_IP  = ${SALT_MASTER_IP}"
echo "  REPOSITORY      = ${REPOSITORY}"
echo ""
echo "If you haven't set SALT_MASTER_SSH_KEY yet, run:"
echo "  gh secret set SALT_MASTER_SSH_KEY --repo ${REPO} < ~/.ssh/your_private_key"
