#cloud-config

hostname: ${node_name}
fqdn: ${node_name}.${internal_domain}

package_update: true
package_upgrade: false

packages:
  - curl

write_files:
  - path: /etc/hosts
    content: |
      127.0.0.1 localhost
      %{ for name, ip in node_ips ~}
      ${ip} ${name}.${internal_domain} ${name}
      %{ endfor ~}

runcmd:
  - curl -fsSL -o /tmp/bootstrap-salt.sh https://github.com/saltstack/salt-bootstrap/releases/latest/download/bootstrap-salt.sh
  - sh /tmp/bootstrap-salt.sh stable
  - mkdir -p /etc/salt/minion.d /etc/salt/pki/minion
  - |
    cat > /etc/salt/pki/minion/minion.pem << 'KEYEOF'
    ${minion_priv_key}KEYEOF
  - |
    cat > /etc/salt/pki/minion/minion.pub << 'KEYEOF'
    ${minion_pub_key}KEYEOF
  - chmod 400 /etc/salt/pki/minion/minion.pem
  - |
    cat > /etc/salt/minion.d/wazuh.conf << 'SALTEOF'
    master: ${master_ip}
    id: ${node_name}.${internal_domain}
    SALTEOF
  - systemctl enable salt-minion
  - systemctl restart salt-minion
