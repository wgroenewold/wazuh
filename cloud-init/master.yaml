#cloud-config

hostname: salt-master

package_update: true
package_upgrade: false

packages:
  - curl
  - git

write_files:
  - path: /etc/hosts
    content: |
      127.0.0.1 localhost
%{ for name, ip in node_ips ~}
      ${ip} ${name}.${internal_domain} ${name}
%{ endfor ~}
%{ for minion_id, pub_key in minion_pub_keys ~}
  - path: /etc/salt/pki/master/minions/${minion_id}
    content: |
      ${pub_key}
    permissions: '0400'
%{ endfor ~}

runcmd:
  - curl -fsSL -o /tmp/bootstrap-salt.sh https://github.com/saltstack/salt-bootstrap/releases/latest/download/bootstrap-salt.sh
  - sh /tmp/bootstrap-salt.sh -M stable
  - mkdir -p /srv/salt /srv/pillar /etc/salt/master.d
  - |
    cat > /etc/salt/master.d/wazuh.conf << 'SALTEOF'
    file_roots:
      base:
        - /srv/salt
    pillar_roots:
      base:
        - /srv/pillar
    SALTEOF
  - git clone ${repository} /tmp/wazuh-repo
  - cp -r /tmp/wazuh-repo/salt/srv/* /srv/salt/
  - cp -r /tmp/wazuh-repo/salt/pillar/* /srv/pillar/
  - rm -rf /tmp/wazuh-repo
  - systemctl enable salt-master salt-minion
  - systemctl restart salt-master salt-minion
